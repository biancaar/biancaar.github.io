<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Bianca Rotaru portfolio" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/LOGO.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/LOGO.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/LOGO.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function (location) {
        if (location.search[1] === "/") {
          var decoded = location.search
            .slice(1)
            .split("&")
            .map(function (segment) {
              return segment.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", location.pathname.slice(0, -1) + decoded + location.hash);
        }
      })(window.location);
    </script>
    <title>Bianca Rotaru Portfolio</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
